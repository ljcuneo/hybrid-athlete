<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e11">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid Athlete">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Hybrid Athlete</title>
<style>
:root{--bg:#0a0e11;--s1:#11171c;--s2:#172027;--s3:#212c34;--line:#25313a;--tx:#ecf1f4;--mu:#8f9da8;--dim:#5d6a74;--ac:#7ee0c3;--ac2:#3d9c80;--ink:#04231a;--warm:#ffb257;--warm-ink:#2b1700;--bad:#ff8080;--blue:#73b9ff;--violet:#b8a2ff;--lime:#c4e86b;--r:18px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:2px 0 16px;font-weight:800}
h2{font-size:20px;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 4px}
p{margin:6px 0}
.eyebrow{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.09em}
.muted{color:var(--mu)}.small{font-size:14px}.center{text-align:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:14px;min-height:50px;padding:0 18px;font-family:inherit;font-size:16px;font-weight:650;color:var(--tx);background:var(--s3);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ac);color:var(--ink)}
.btn.warm{background:var(--warm);color:var(--warm-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid #5b2f2f;color:var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%;margin-top:10px}
.btn.big{min-height:58px;font-size:18px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .btn{flex:1}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 12px;width:100%;-webkit-appearance:none;appearance:none}
input[type=date]{min-width:0;display:block}
textarea{min-height:88px;resize:vertical;line-height:1.4}
textarea.sm{min-height:56px;font-size:16px;margin-top:10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-2px}
::placeholder{color:var(--dim)}
.lbl{display:block;font-size:13px;font-weight:650;color:var(--mu);margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--mu);white-space:nowrap}
.pill.ok{background:rgba(126,224,195,.15);color:var(--ac)}
.pill.warm{background:rgba(255,178,87,.15);color:var(--warm)}
.pill.bad{background:rgba(255,128,128,.13);color:var(--bad)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,17,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:var(--dim);font-family:inherit;font-size:11px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;cursor:pointer;position:relative}
nav button.on{color:var(--ac)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--warm)}
/* toast + sheet */
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);transition:transform .25s;z-index:60;background:var(--tx);color:var(--bg);font-weight:650;font-size:15px;padding:12px 18px;border-radius:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet-card p{color:var(--mu)}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
/* rest bar */
#restbar{position:fixed;left:0;right:0;z-index:25;bottom:calc(65px + env(safe-area-inset-bottom));padding:0 12px 8px}
#restbar .rb{max-width:616px;margin:0 auto;position:relative;overflow:hidden;background:var(--s2);border:1px solid #3a4853;border-radius:16px;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#restbar .rb-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(126,224,195,.12);pointer-events:none}
#restbar .rb-l{position:relative;flex:1;min-width:0;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restbar .rb-l b{display:block;color:var(--tx);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
#restbar button{position:relative;min-height:44px;min-width:50px;border-radius:11px;border:0;background:var(--s3);color:var(--tx);font-family:inherit;font-weight:700;font-size:14px}
#restbar.over .rb{border-color:var(--ac)}#restbar.over .rb-l b{color:var(--ac)}
/* banner */
.banner{border-color:rgba(255,178,87,.45);background:rgba(255,178,87,.07)}
.banner.err{border-color:rgba(255,128,128,.5);background:rgba(255,128,128,.07)}
/* dashboard */
.hero{padding:18px}
.hero-t{margin:6px 0 2px;font-size:24px;letter-spacing:-.015em}
.hero.st-today{border-color:rgba(126,224,195,.35);background:linear-gradient(180deg,rgba(126,224,195,.09),rgba(126,224,195,0) 70%),var(--s1)}
.hero.st-active{border-color:rgba(255,178,87,.5);background:linear-gradient(180deg,rgba(255,178,87,.1),rgba(255,178,87,0) 70%),var(--s1)}
.hero.st-done{border-color:rgba(126,224,195,.25)}
.mini{list-style:none;padding:0;margin:12px 0 2px}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.mini li b{color:var(--mu);font-weight:600;white-space:nowrap}
.done-line{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ac);font-weight:650}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{background:none;border:0;color:var(--mu);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:12px;font-weight:650;cursor:pointer}
.strip .c{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:11px;font-weight:700}
.strip .st-done .c{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.strip .st-today .c{border-color:var(--tx);color:var(--tx)}
.strip .st-today{color:var(--tx)}
.strip .st-active .c{border-color:var(--warm);color:var(--warm);box-shadow:0 0 0 4px rgba(255,178,87,.15)}
.strip .st-missed .c{border-color:#5d3636;color:var(--bad)}
.strip .st-open .c,.strip .st-rest .c{border-style:dashed}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring text{font-size:20px;font-weight:800;fill:var(--tx)}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;flex:1;font-size:14px}
.breakdown div{display:flex;justify-content:space-between}.breakdown b{font-variant-numeric:tabular-nums}
.breakdown .full{color:var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mu);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
details.guide summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary:after{content:"+";font-size:22px;color:var(--mu)}
details.guide[open] summary:after{content:"−"}
details.guide ul{margin:10px 0 0;padding-left:18px;color:var(--mu)}
details.guide li{margin:6px 0}details.guide li b{color:var(--tx)}
/* workouts list */
.day-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 8px;color:var(--tx);font-family:inherit;min-height:66px;cursor:pointer}
.dr-ic{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;color:var(--dim)}
.dr-t{flex:1;min-width:0}.dr-t b{display:block;font-size:16px}.dr-t small{color:var(--mu);font-size:13px}
.dr-s{font-size:12px;font-weight:700;color:var(--mu);text-align:right}
.day-row.st-done .dr-ic{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.day-row.st-done .dr-s{color:var(--ac)}
.day-row.st-today{border-color:#3d4c58;background:var(--s2)}
.day-row.st-today .dr-ic{border-color:var(--tx);color:var(--tx)}.day-row.st-today .dr-s{color:var(--tx)}
.day-row.st-active{border-color:rgba(255,178,87,.55);background:rgba(255,178,87,.06)}
.day-row.st-active .dr-ic{border-color:var(--warm);color:var(--warm)}.day-row.st-active .dr-s{color:var(--warm)}
.day-row.st-missed .dr-ic{border-color:#5d3636;color:var(--bad)}.day-row.st-missed .dr-s{color:var(--bad)}
.day-row.st-open .dr-ic,.day-row.st-rest .dr-ic{border-style:dashed}
.day-row.st-upcoming .dr-t b{color:#cdd6dc}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font-family:inherit;min-height:74px;cursor:pointer}
.tile b{display:block;font-size:16px}.tile small{color:var(--mu);font-size:13px}
.tile .tg{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* session */
.sess-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.back{background:var(--s2);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:44px;height:44px;flex:none;display:grid;place-items:center;cursor:pointer}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sess-h h1{font-size:24px;margin:0}
.sess-h .muted{font-size:14px}
.meta-row{display:flex;gap:10px;align-items:flex-end}
.meta-row>div{flex:1;min-width:0}
.counter{font-size:13px;color:var(--mu);font-weight:650;text-align:right;white-space:nowrap;padding-bottom:12px}
.counter b{display:block;color:var(--tx);font-size:22px;font-variant-numeric:tabular-nums}
.check-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;color:var(--tx);font-family:inherit;cursor:pointer;min-height:56px}
.check-row small{display:block;color:var(--mu);font-size:13px}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:var(--ink)}
.check-row.on .tick{background:var(--ac);border-color:var(--ac)}
.check-row.on{border-color:rgba(126,224,195,.3)}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;scroll-margin-top:12px}
.ex-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;color:var(--tx);text-align:left;font-family:inherit;min-height:66px;cursor:pointer}
.ex-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mu);flex:none}
.ex.partial .ex-dot{border-color:var(--warm);color:var(--warm)}
.ex.complete .ex-dot{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.ex.complete .ex-title b{color:var(--mu)}
.ex-title{flex:1;min-width:0}.ex-title b{display:block;font-size:16px}.ex-title small{color:var(--mu);font-size:13px}
.chev{width:10px;height:10px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s;flex:none}
.ex.open .chev{transform:rotate(-135deg);margin-bottom:-4px}
.ex-body{display:none;padding:0 14px 14px}
.ex.open .ex-body{display:block}
.ex-meta{display:grid;gap:6px;font-size:14px;background:var(--s2);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ex-meta span{display:inline-block;min-width:74px;color:var(--mu);font-weight:650;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.hint-good{font-size:14px;color:var(--ac);background:rgba(126,224,195,.08);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.sets-h,.set{display:grid;grid-template-columns:26px 1fr 1fr 54px;gap:8px;align-items:center}
.sets-h{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sets-h span:last-child{text-align:center}
.set{margin-bottom:8px;position:relative}
.set-n{font-weight:800;color:var(--mu);text-align:center;font-variant-numeric:tabular-nums}
.set input{text-align:center;font-variant-numeric:tabular-nums;font-weight:650;padding:8px 6px}
.set-check{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--s2);color:var(--dim);display:grid;place-items:center;cursor:pointer}
.set.done .set-check{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.set.done input{background:rgba(126,224,195,.07);border-color:rgba(126,224,195,.25)}
.pr{position:absolute;right:-4px;top:-7px;background:var(--warm);color:var(--warm-ink);font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;pointer-events:none}
.ex-tools{display:flex;gap:6px;margin-top:4px}.ex-tools .btn{flex:1}
details.cue{margin-top:10px;font-size:14px;color:var(--mu)}
details.cue summary{cursor:pointer;color:var(--mu);font-weight:650;min-height:32px;display:flex;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{min-height:42px;border:0;border-radius:10px;background:none;color:var(--mu);font-family:inherit;font-size:15px;font-weight:650;cursor:pointer}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--tx);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--s2);border-radius:14px;padding:12px;text-align:left;color:var(--tx);font-family:inherit;min-height:70px;cursor:pointer}
.opt b{display:block;font-size:15px}.opt small{color:var(--mu);font-size:12px}
.opt.on{border-color:var(--ac);background:rgba(126,224,195,.08)}
.list-check{list-style:none;margin:8px 0 0;padding:0}
.list-check li{margin:0}
.list-check .check-row{background:var(--s2);min-height:50px;padding:10px 12px;margin-bottom:6px}
/* emom */
.var-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.var-chips button{border:1px solid var(--line);background:var(--s1);color:var(--tx);border-radius:14px;padding:8px 4px;font-family:inherit;cursor:pointer;min-height:62px;position:relative}
.var-chips b{display:block;font-size:18px}.var-chips small{display:block;font-size:11px;color:var(--mu);line-height:1.2}
.var-chips button.on{border-color:var(--warm);background:rgba(255,178,87,.08)}
.var-chips .sug{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ink);font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
.timer{text-align:center;padding:18px 16px}
.em-top{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.em-clock{font-size:96px;font-weight:800;line-height:1;margin:14px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.em-clock.paused{color:var(--mu)}
.em-clock.done{font-size:64px;color:var(--ac)}
.em-bar{height:6px;background:var(--s3);border-radius:6px;overflow:hidden;margin:0 0 14px}
.em-bar i{display:block;height:100%;background:var(--warm);border-radius:6px}
.em-now small{display:block;font-size:12px;font-weight:700;color:var(--warm);text-transform:uppercase;letter-spacing:.08em}
.em-now b{display:block;font-size:26px;letter-spacing:-.01em;line-height:1.15;margin:2px 0}
.em-now span{font-size:18px;color:var(--mu);font-weight:600}
.em-next{margin:10px 0 14px;font-size:14px;color:var(--mu)}
.em-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.emg{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--cols),38px);gap:6px;align-items:center;margin-top:10px}
.emg-h{font-size:11px;font-weight:700;color:var(--dim);text-align:center}
.emg-n{font-size:14px;font-weight:600;line-height:1.2;min-width:0}.emg-n small{display:block;color:var(--mu);font-weight:500;font-size:12px}
.emg-c{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--s2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.emg-c.on{background:var(--ac);border-color:var(--ac)}
.emg-c.cur{border-color:var(--warm);box-shadow:0 0 0 3px rgba(255,178,87,.2)}
.loadrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}
/* history */
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}
.log{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin:0 0 8px}
.log-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;color:var(--tx);text-align:left;font-family:inherit;cursor:pointer;min-height:64px}
.cat{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.log-t{flex:1;min-width:0}.log-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log-t small{color:var(--mu);font-size:13px}
.log-b{display:none;padding:0 14px 14px;font-size:14px}
.log.open .log-b{display:block}
.log-b .xr{padding:8px 0;border-top:1px solid var(--line)}
.log-b .xr b{display:block;font-size:14px}.log-b .xr span{color:var(--mu)}

<body>
<main id="app"><p class="muted" style="padding-top:40px;text-align:center">Loading your training log…</p></main>
<div id="restbar" hidden></div>
<nav id="nav" aria-label="Main"></nav>

<noscript><p style="padding:20px">Hybrid Athlete needs JavaScript enabled.</p></noscript>
<script>
'use strict';
/* =========================================================================
   Hybrid Athlete Tracker · v2
   Single-file, no build step, GitHub Pages compatible.
   Storage: IndexedDB (primary) + localStorage mirror (fallback / crash safety).
   Legacy v1 data (localStorage "hybridAthleteLogV1") is copied, never deleted.
   ========================================================================= */
const APP_VERSION='2.0.0', SCHEMA=2;
const DB_NAME='hybrid-athlete', MIRROR='hybridAthleteV2Mirror', LEGACY='hybridAthleteLogV1', LEGACY_DRAFT='hybridAthleteDraftV1';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function dOf(ds){const [y,m,d]=String(ds).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12)}
function addDays(ds,n){const d=dOf(ds);d.setDate(d.getDate()+n);return localDate(d)}
function mondayOf(ds=localDate()){const d=dOf(ds);d.setDate(d.getDate()-(d.getDay()+6)%7);return localDate(d)}
function weekIdx(ds){return Math.round((dOf(mondayOf(ds))-dOf('2026-01-05'))/(7*864e5))}
const fmtDate=(ds,o={weekday:'short',month:'short',day:'numeric'})=>{try{return dOf(ds).toLocaleDateString(undefined,o)}catch(e){return ds}};
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function range(str){const m=String(str||'').match(/(\d+)(?:\s*[–-]\s*(\d+))?/);if(!m)return[null,null];return[+m[1],+(m[2]||m[1])]}
const CHECK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const BACK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

/* ---------- program ---------- */
function X(name,sets,reps,kind,role,cue,extra){return Object.assign({key:norm(name),name,sets,reps,kind,role,cue},extra||{})}
// kind: load = weight + reps · bw = added weight + reps (bodyweight tracked separately) · carry = weight per hand + seconds · hold = seconds
const STRENGTH={
 A:{id:'A',name:'Upper Body Strength A',short:'Upper A',dur:'45–60 min',focus:'Press · pull · shoulders · core',ex:[
  X('Bench Press',3,'6–8','load','main','Shoulder blades pinned, feet planted. Touch mid-chest and press back over the shoulders.'),
  X('Weighted Pull-ups',3,'6–8','bw','main','Dead hang to chin over bar. Log added weight only — bodyweight is tracked separately.'),
  X('Weighted Dips',3,'6–10','bw','main','Slight forward lean, shoulders down, elbows to about 90°. Log added weight only.'),
  X('Chest-Supported Row',3,'8–12','load','acc','Chest stays on the pad. Drive elbows toward the hips and pause at the top.'),
  X('Dumbbell Lateral Raises',2,'12–15','load','acc','Weight per dumbbell. Lead with the elbows and stop at shoulder height.'),
  X('Face Pulls',2,'15–20','load','acc','Rope to forehead, rotate thumbs back, squeeze the rear delts.'),
  X('Ab Wheel',3,'8–12','bw','acc','Ribs down, glutes tight. Only roll as far as you can without the low back sagging.')]},
 B:{id:'B',name:'Lower Body Strength B',short:'Lower B',dur:'50–60 min',focus:'Leg press · hinge · single-leg · anti-rotation',ex:[
  X('Leg Press',3,'8–10','load','main','Feet shoulder-width. Lower until just before the hips curl off the pad.'),
  X('Romanian Deadlift',3,'6–8','load','main','Soft knees, hips back, bar close. Stop when the hamstrings are loaded, before the back rounds.'),
  X('Bulgarian Split Squat',2,'8/leg','load','acc','Weight per dumbbell. Slight forward torso; front knee tracks over the toes.'),
  X('Seated or Lying Leg Curl',2,'10–12','load','acc','Squeeze at full flexion and control the way down.'),
  X('Standing Calf Raises',3,'12–15','load','acc','Pause in the stretch at the bottom, squeeze at the top.'),
  X('Pallof Press',3,'12/side','load','acc','Stand tall, press straight out and resist rotation for a 1-second hold.')]},
 C:{id:'C',name:'Full Body Strength C',short:'Full Body C',dur:'45–60 min',focus:'Power · press · pull · carries',ex:[
  X('Kettlebell Swings',3,'12','load','main','Hinge and snap the hips; the bell floats to chest height. Power, not a squat.',{rest:90}),
  X('Incline Dumbbell Press',3,'8–10','load','main','Weight per dumbbell. Bench at ~30°, elbows about 45° from the torso.'),
  X('Weighted Chin-ups',3,'6–8','bw','main','Palms facing you, full hang to chin over bar. Log added weight only.'),
  X('Step-ups',2,'8/leg','load','acc','Weight per dumbbell. Drive through the top foot — don\'t push off the bottom leg.'),
  X("Farmer's Carries",3,'30–45 sec','carry','acc','Weight per hand. Tall posture, short quick steps, crush the handles.'),
  X('Copenhagen Plank',2,'20–30 sec/side','hold','acc','Top leg on the bench, body in a straight line. Bend the top knee to make it easier.')]}};
const KNOWN={};Object.values(STRENGTH).forEach(p=>p.ex.forEach(x=>KNOWN[x.key]=x));
const ALIAS={lateralraises:'dumbbelllateralraises',calfraises:'standingcalfraises',legcurl:'seatedorlyinglegcurl'};
const aliasKey=n=>{const k=norm(n);return ALIAS[k]||k};
const kindFor=k=>KNOWN[k]?.kind||(/pullup|chinup|dip|legraise|hollow|lsit|plank|abwheel|pushup/.test(k)?'bw':'load');

const EMOMS={
 A:{id:'A',name:'EMOM A — Strength Endurance',short:'Strength Endurance',rounds:5,st:[
  {name:'Push-ups',target:'10 reps'},{name:'Kettlebell Swings',target:'12 reps',load:true},{name:'Ring Rows',target:'10 reps'},{name:'Plank',target:'30 sec'}]},
 B:{id:'B',name:'EMOM B — Athletic Conditioning',short:'Athletic Conditioning',rounds:5,st:[
  {name:'Kettlebell Deadlifts',target:'10 reps',load:true},{name:'Dumbbell Push Press',target:'8 reps',load:true},{name:'Alt. Reverse Lunges',target:'10 reps',load:true},{name:'Bike',target:'30 sec'}]},
 C:{id:'C',name:'EMOM C — Upper Body + Core',short:'Upper Body + Core',rounds:5,st:[
  {name:'Push-ups',target:'8–12 reps'},{name:'Dumbbell Rows',target:'10 (5/side)',load:true},{name:'Hollow Hold',target:'30 sec'},{name:'Band Pull-aparts',target:'12 reps'}]},
 L:{id:'L',name:'Light EMOM — Upper Body + Core',short:'Light (optional)',rounds:3,optional:true,st:[
  {name:'Push-ups',target:'8 easy reps'},{name:'Band Pull-aparts',target:'12 reps'},{name:'Dead Bug',target:'6/side'},{name:'Bird Dog',target:'5/side'}]}};
const EMOM_ORDER=['A','B','C'];
const suggestedEmom=(ds=localDate())=>EMOM_ORDER[((weekIdx(ds)%3)+3)%3];

const WEEK=[
 {day:'Mon',kind:'strength',ref:'A',title:'Upper Body Strength A',dur:'45–60 min',req:true},
 {day:'Tue',kind:'strength',ref:'B',title:'Lower Body Strength B',dur:'50–60 min',req:true},
 {day:'Wed',kind:'emom',title:'Rotating EMOM',dur:'20 min',req:true},
 {day:'Thu',kind:'strength',ref:'C',title:'Full Body Strength C',dur:'45–60 min',req:true},
 {day:'Fri',kind:'surf',title:'Surf + Mobility',dur:'45–90 min',req:true,flex:true},
 {day:'Sat',kind:'recovery',title:'Recovery',dur:'10–20 min · optional',req:false},
 {day:'Sun',kind:'soccer',title:'Soccer',dur:'60–90 min',req:true}];

const MOBILITY=[{n:'Cat-cow',d:'10 slow reps'},{n:"World's greatest stretch",d:'5/side'},{n:'Thoracic open books',d:'8/side'},{n:'90/90 hip switches',d:'8/side'},{n:'Couch stretch',d:'45 sec/side'},{n:'Cobra / prone press-up',d:'10 reps'},{n:'Shoulder CARs',d:'5/side'},{n:'Deep squat hold',d:'60 sec'}];
const WARMUP=[{n:'Easy jog',d:'2–3 min'},{n:'Leg swings',d:'10 front + 10 side / leg'},{n:'Walking lunge + twist',d:'8/side'},{n:'High knees & butt kicks',d:'2 × 20 m'},{n:'Lateral shuffle & carioca',d:'2 × 20 m'},{n:'Hip open / close gates',d:'8/side'},{n:'A-skips',d:'2 × 20 m'},{n:'Build-up strides',d:'3 × 30 m at 60/75/90%'},{n:'Quick touches with the ball',d:'2 min'}];
const GUIDE=[['Main lifts','rest 2–3 minutes.'],['Accessories','rest 60–90 seconds.'],['Effort','most sets 1–3 reps in reserve.'],['Progression','add weight when every set reaches the top of the rep range with good form.'],['Warm-up','5–10 minutes before every session.'],['Fatigue','cut volume (drop a set per exercise) when fatigue builds up.'],['Sunday soccer','prioritize recovery the day before.'],['Surf','move it to whichever day has waves — it still counts.']];
const CATS={strength:{l:'Strength',c:'var(--ac)',i:'S'},emom:{l:'EMOM',c:'var(--warm)',i:'E'},surf:{l:'Surf',c:'var(--blue)',i:'≈'},soccer:{l:'Soccer',c:'var(--lime)',i:'⚽'},recovery:{l:'Recovery',c:'var(--violet)',i:'R'},activity:{l:'Other',c:'var(--mu)',i:'+'}};
const LEGACY_NAMES={A:'Strength A',B:'Strength B',C:'Strength C',E1:'EMOM 1 — Upper Strength',E2:'EMOM 2 — Legs + Hinge + Core',E3:'EMOM 3 — Upper Volume + Grip',E4:'EMOM 4 — Power + Surf'};

/* ---------- state ---------- */
const S={logs:[],meta:{weight:[]},draft:null,tab:'dash',view:null,hist:'all',histN:40,openLog:null,progEx:null,rest:null,storageError:null,persisted:null,lastSaved:null};

/* ---------- storage ---------- */
function lsAvailable(){try{const k='__ha_t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}}
function idbOpen(){return new Promise((res,rej)=>{
 if(!('indexedDB' in window)||!window.indexedDB)return rej(new Error('IndexedDB not supported'));
 let done=false;const t=setTimeout(()=>{if(!done){done=true;rej(new Error('IndexedDB open timed out'))}},5000);
 let rq;try{rq=indexedDB.open(DB_NAME,1)}catch(e){clearTimeout(t);return rej(e)}
 rq.onupgradeneeded=()=>{const d=rq.result;if(!d.objectStoreNames.contains('logs'))d.createObjectStore('logs',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};
 rq.onsuccess=()=>{const d=rq.result;if(done){try{d.close()}catch(e){}return}done=true;clearTimeout(t);d.onversionchange=()=>d.close();res(d)};
 rq.onerror=()=>{if(done)return;done=true;clearTimeout(t);rej(rq.error||new Error('IndexedDB open failed'))};
})}
function mirror(){ // synchronous safety copy; primary store when IndexedDB is unavailable
 if(Store.mode==='memory')return;
 try{localStorage.setItem(MIRROR,JSON.stringify({app:'hybrid-athlete',schemaVersion:SCHEMA,savedAt:Date.now(),logs:S.logs,meta:S.meta,draft:S.draft}))}
 catch(e){if(Store.mode==='local')throw e}
}
function readMirror(){try{const m=JSON.parse(localStorage.getItem(MIRROR)||'null');return m&&Array.isArray(m.logs)?m:null}catch(e){return null}}
const Store={mode:'memory',db:null,
 async init(){try{this.db=await idbOpen();this.mode='idb'}catch(e){console.warn('Falling back from IndexedDB:',e);this.mode=lsAvailable()?'local':'memory'}},
 _tx(stores,mode,fn){return new Promise((res,rej)=>{let t;try{t=this.db.transaction(stores,mode)}catch(e){return rej(e)}try{fn(t)}catch(e){try{t.abort()}catch(_){}return rej(e)}t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Transaction aborted'))})},
 async loadAll(){const out={logs:[],meta:{}};await this._tx(['logs','meta'],'readonly',t=>{const r=t.objectStore('logs').getAll();r.onsuccess=()=>{out.logs=r.result||[]};const c=t.objectStore('meta').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.meta[cur.key]=cur.value;cur.continue()}}});return out},
 async putLog(l){mirror();if(this.mode==='idb')await this._tx(['logs'],'readwrite',t=>t.objectStore('logs').put(l))},
 async delLog(id){mirror();if(this.mode==='idb')await this._tx(['logs'],'readwrite',t=>t.objectStore('logs').delete(id))},
 async putMeta(k,v){mirror();if(this.mode==='idb')await this._tx(['meta'],'readwrite',t=>{const s=t.objectStore('meta');if(v==null)s.delete(k);else s.put(v,k)})},
 async replaceAll(){mirror();if(this.mode!=='idb')return;await this._tx(['logs','meta'],'readwrite',t=>{const L=t.objectStore('logs'),M=t.objectStore('meta');L.clear();M.clear();S.logs.forEach(l=>L.put(l));Object.entries(S.meta).forEach(([k,v])=>{if(v!==undefined)M.put(v,k)});if(S.draft)M.put(S.draft,'draft')})}};
function okSaved(){S.lastSaved=Date.now();if(S.storageError){S.storageError=null;const b=$('#banner-err');if(b)b.remove()}}
function fail(e,msg){console.error(e);S.storageError=(msg||'Couldn\'t save to this device.')+(e&&e.name==='QuotaExceededError'?' Storage is full.':'');toast(S.storageError);render()}
let saveT=null;
function touch(){if(S.draft)S.draft.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(saveDraftNow,250)}
async function saveDraftNow(){clearTimeout(saveT);saveT=null;try{await Store.putMeta('draft',S.draft);okSaved()}catch(e){fail(e,'Couldn\'t autosave this session.')}}
function flushSync(){if(saveT){clearTimeout(saveT);saveT=null;saveDraftNow()}try{mirror()}catch(e){}}

/* ---------- migration ---------- */
function upgradeLog(l){
 if(!l||typeof l!=='object'||!l.date)return null;
 if(l.schema===SCHEMA)return l;
 const o={...l,id:String(l.id??uid()),schema:SCHEMA,program:'v1',createdAt:l.createdAt||(typeof l.id==='number'?l.id:Date.now())};
 if(l.type==='sport'){
  const n=String(l.name||'').toLowerCase(),eff=String(l.effort||'').toLowerCase();
  o.category=n.includes('surf')?'surf':n.includes('soccer')?'soccer':/recovery|mobility|walk/.test(n)?'recovery':'activity';
  o.intensity=eff.startsWith('easy')?'easy':eff.startsWith('hard')?'hard':'moderate';
  o.duration=num(l.duration)??'';o.status='completed';
 }else{
  const legacyEmom=/^E\d?$/.test(String(l.type||''));
  o.category=legacyEmom?'emom':'strength';
  if(!o.name)o.name=LEGACY_NAMES[l.type]||'Workout';
  o.exercises=(Array.isArray(l.exercises)?l.exercises:[]).map(e=>{const k=aliasKey(e.name);return{key:legacyEmom?'emom:'+k:k,name:e.name,kind:legacyEmom?'load':kindFor(k),sets:(Array.isArray(e.sets)?e.sets:[]).map(s=>({weight:s?.weight??'',reps:s?.reps??'',secs:s?.secs??'',done:!!s?.done}))}});
  o.status=l.recovered?'partial':'completed';
 }
 return o;
}
function migrateLegacy(){
 const out={logs:[],meta:{schemaVersion:SCHEMA,weight:[]}};let raw=null;
 try{raw=JSON.parse(localStorage.getItem(LEGACY)||'null')}catch(e){}
 if(raw&&typeof raw==='object'){if(Array.isArray(raw.logs))out.logs=raw.logs.slice();if(Array.isArray(raw.weight))out.meta.weight=raw.weight.filter(w=>w&&w.date&&num(w.value)!=null);out.meta.migratedFromV1At=Date.now();out.meta.legacyCount=out.logs.length}
 try{ // unfinished workout from the old app → keep it as a partial session instead of dropping it
  const d=JSON.parse(localStorage.getItem(LEGACY_DRAFT)||'null');
  if(d&&d.touched&&d.draft&&typeof d.draft==='object'){
   const ex=Object.entries(d.draft).map(([name,sets])=>({name,sets:Array.isArray(sets)?sets:[]}));
   const has=ex.some(e=>e.sets.some(s=>s&&(s.done||String(s.weight??'')!==''||String(s.reps??'')!=='')));
   if(has||d.notes)out.logs.push({id:'v1draft-'+(d.savedAt||Date.now()),date:d.editDate||localDate(),type:d.selected||'A',name:(LEGACY_NAMES[d.selected]||'Workout')+' (recovered)',notes:[d.notes,'Unfinished workout recovered from the previous app version.'].filter(Boolean).join(' — '),exercises:ex,recovered:true});
  }}catch(e){}
 return out;
}
function validDraft(d){if(!d||typeof d!=='object'||!d.kind||!d.date||!d.id)return false;if(d.kind==='strength')return !!STRENGTH[d.ref]&&Array.isArray(d.ex);if(d.kind==='emom')return !!EMOMS[d.ref]&&!!d.emom;return ['surf','soccer','recovery','activity'].includes(d.kind)&&!!d.f}

/* ---------- queries ---------- */
const strengthLogs=()=>S.logs.filter(l=>l.category==='strength');
const doneSets=l=>(l.exercises||[]).reduce((a,e)=>a+(e.sets||[]).filter(s=>s.done).length,0);
const sortDesc=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0);
function prevFor(key,excludeId){
 const ls=strengthLogs().filter(l=>l.id!==excludeId).sort(sortDesc);
 for(const l of ls){const e=(l.exercises||[]).find(x=>x.key===key);if(!e)continue;const done=e.sets.filter(s=>s.done);if(done.length)return{date:l.date,sets:done,all:e.sets}}
 return null;
}
function setScore(kind,s){const w=num(s.weight)||0,r=num(s.reps)||0,t=num(s.secs)||0;
 if(kind==='load')return r?w*(1+r/30):0;if(kind==='bw')return w*1000+r;if(kind==='carry')return w*1000+t;return t*1000+w}
function bestFor(key,kind,excludeId){const b={score:0,set:null,date:null,maxW:0,maxWDate:null};
 for(const l of strengthLogs()){if(l.id===excludeId)continue;for(const e of l.exercises||[]){if(e.key!==key)continue;for(const s of e.sets){if(!s.done)continue;const sc=setScore(kind,s);if(sc>b.score){b.score=sc;b.set=s;b.date=l.date}const w=num(s.weight)||0;if(w>b.maxW){b.maxW=w;b.maxWDate=l.date}}}}
 return b}
function historyFor(key){return strengthLogs().map(l=>{const e=(l.exercises||[]).find(x=>x.key===key);return e?{date:l.date,created:l.createdAt||0,sets:e.sets.filter(s=>s.done),bw:l.bw}:null}).filter(x=>x&&x.sets.length).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created)}
function fmtSet(kind,s){const w=num(s.weight),r=num(s.reps),t=num(s.secs);
 if(kind==='bw')return `${w?'+'+w:'BW'} × ${r??'—'}`;
 if(kind==='carry')return `${w??'—'} lb · ${t??'—'}s`;
 if(kind==='hold')return `${t??'—'}s${w?' +'+w+' lb':''}`;
 return `${w??'BW'} × ${r??'—'}`}
const restSec=e=>e.rest||(e.role==='main'?150:75);
const restLabel=e=>e.rest?e.rest+' s':e.role==='main'?'2–3 min':'60–90 s';
const latestBW=()=>{const w=[...(S.meta.weight||[])].sort((a,b)=>a.date.localeCompare(b.date));return w.length?num(w[w.length-1].value):null};
function weekCounts(mon){const end=addDays(mon,6);const w=S.logs.filter(l=>l.date>=mon&&l.date<=end&&l.status!=='skipped');const c=k=>w.filter(l=>l.category===k).length;
 const r={strength:c('strength'),emom:c('emom'),surf:c('surf'),soccer:c('soccer'),recovery:c('recovery'),activity:c('activity')};r.score=Math.min(r.strength,3)+Math.min(r.emom,1)+Math.min(r.surf,1)+Math.min(r.soccer,1);return r}
function weekPlan(mon=mondayOf()){
 const today=localDate(),end=addDays(mon,6),thisWeek=mon===mondayOf(today);
 const wl=S.logs.filter(l=>l.date>=mon&&l.date<=end&&l.status!=='skipped').sort((a,b)=>a.date.localeCompare(b.date));
 return WEEK.map((w,i)=>{const date=addDays(mon,i);let log;
  if(w.kind==='strength')log=wl.find(l=>l.category==='strength'&&l.program==='v2'&&l.type===w.ref);
  else log=wl.find(l=>l.category===w.kind);
  let st;if(log)st='done';else if(date===today)st='today';else if(date>today)st='upcoming';
  else if(!w.req)st='rest';else if(w.flex&&thisWeek)st='open';else st='missed';
  return{...w,i,date,log,st}})}
const draftMatches=p=>!!S.draft&&S.draft.kind===p.kind&&(p.kind!=='strength'||S.draft.ref===p.ref);
function draftName(d){if(!d)return'';if(d.kind==='strength')return STRENGTH[d.ref].name;if(d.kind==='emom')return EMOMS[d.ref].name;return{surf:'Surf session',soccer:'Soccer game',recovery:'Recovery',activity:'Activity'}[d.kind]}

/* ---------- audio · vibration · wake lock ---------- */
let AC=null;
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f=880,d=.12,v=.28){try{if(!AC||document.hidden)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.03)}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
let WL=null;
async function wake(on){try{if(on){if('wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}else if(WL){const w=WL;WL=null;await w.release()}}catch(e){WL=null}}

/* ---------- toast / sheet ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
function sheet({title,body='',actions}){return new Promise(res=>{const el=$('#sheet');
 el.innerHTML=`<div class="sheet-bg" data-sv=""></div><div class="sheet-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body?`<p>${body}</p>`:''}${actions.map((a,i)=>`<button class="btn full ${a.cls||'ghost'}" data-sv="${i}">${esc(a.label)}</button>`).join('')}</div>`;
 el.classList.add('show');
 el.onclick=ev=>{const b=ev.target.closest('[data-sv]');if(!b)return;el.classList.remove('show');el.innerHTML='';el.onclick=null;const i=b.dataset.sv;res(i===''?null:actions[+i].v)}})}
const ask=(title,body,yes='OK',cls='primary')=>sheet({title,body,actions:[{label:yes,v:true,cls},{label:'Cancel',v:false}]});

function newEmomDraft(v,date){const e=EMOMS[v];return{id:uid(),kind:'emom',ref:v,date,startedAt:Date.now(),updatedAt:Date.now(),notes:'',emom:{grid:e.st.map(()=>Array(e.rounds).fill(false)),loads:lastEmomLoads(v),timer:{start:null,pausedAt:null,paused:0,lastIdx:0,done:false}}}}

 f:{duration:'',intensity:kind==='recovery'?'easy':'moderate',conditions:'',tags:[],status:'completed',recoveryType:'rest',activity:'Climbing'},
 mob:Array(MOBILITY.length).fill(false),warm:Array(WARMUP.length).fill(false)}}
function newDraft(kind,ref,date){if(kind==='strength')return newStrengthDraft(ref,date);if(kind==='emom')return newEmomDraft(ref||suggestedEmom(date),date);return newActDraft(kind,date)}
async function openSession(kind,ref,date=localDate()){
 if(S.draft){
  if(S.draft.kind===kind&&(kind!=='strength'||S.draft.ref===ref)){S.tab='work';S.view='session';scrollTo(0,0);render();return}
  const c=await sheet({title:'You have an unfinished session',body:`${esc(draftName(S.draft))} · ${esc(fmtDate(S.draft.date))}. Starting something new discards it.`,actions:[{label:'Resume it',v:'resume',cls:'warm'},{label:'Discard and start new',v:'new',cls:'danger'},{label:'Cancel',v:null}]});
  if(c==='resume'){S.tab='work';S.view='session';scrollTo(0,0);render();return}
  if(c!=='new')return;
  clearRest();wake(false);
 }
 S.draft=newDraft(kind,ref,date);await saveDraftNow();S.tab='work';S.view='session';scrollTo(0,0);render();
}
async function discardDraft(){if(!await ask('Discard this session?','Nothing from it will be saved to history.','Discard','danger'))return;S.draft=null;clearRest();wake(false);await saveDraftNow();S.view=null;render();toast('Session discarded')}

/* ---------- rest timer ---------- */
function startRest(sec,label){unlockAudio();S.rest={end:Date.now()+sec*1000,total:sec,label,fired:false};if(S.draft){S.draft.rest=S.rest;touch()}renderRest()}
function clearRest(){S.rest=null;if(S.draft&&S.draft.rest){S.draft.rest=null;touch()}renderRest()}
function renderRest(){const el=$('#restbar');if(!S.rest){el.hidden=true;el.innerHTML='';return}el.hidden=false;
 el.innerHTML=`<div class="rb"><div class="rb-fill" id="rb-fill"></div><div class="rb-l"><span id="rb-lab">Rest · ${esc(S.rest.label)}</span><b id="rb-t">${mmss((S.rest.end-Date.now())/1000)}</b></div><button data-a="restAdj" data-v="-15" aria-label="Subtract 15 seconds">−15</button><button data-a="restAdj" data-v="15" aria-label="Add 15 seconds">+15</button><button data-a="restSkip">${S.rest.fired?'Close':'Skip'}</button></div>`;restTick()}
function restTick(){if(!S.rest)return;const rem=(S.rest.end-Date.now())/1000,el=$('#restbar');
 if(rem<=0&&!S.rest.fired){S.rest.fired=true;beep(988,.18);setTimeout(()=>beep(1318,.25),220);buzz([200,100,200]);el.classList.add('over');const l=$('#rb-lab');if(l)l.textContent='Rest done — next set';const b=el.querySelector('[data-a=restSkip]');if(b)b.textContent='Close';S.rest.closeAt=Date.now()+8000}
 if(S.rest.fired&&Date.now()>S.rest.closeAt){clearRest();el.classList.remove('over');return}
 if(!S.rest.fired)el.classList.remove('over');
 const t=$('#rb-t');if(t)t.textContent=rem>0?mmss(rem):'0:00';const f=$('#rb-fill');if(f)f.style.width=Math.min(100,Math.max(0,(1-rem/S.rest.total)*100))+'%'}

/* ---------- strength session ---------- */
function isPR(e,s,j){const b=bestFor(e.key,e.kind,S.draft.id);if(!b.set)return false;let ref=b.score,refW=b.maxW;
 e.sets.forEach((x,k)=>{if(k!==j&&x.done){ref=Math.max(ref,setScore(e.kind,x));refW=Math.max(refW,num(x.weight)||0)}});
 return setScore(e.kind,s)>ref+1e-9||(e.kind==='load'&&(num(s.weight)||0)>refW)}
function checkSet(i,j){const d=S.draft,e=d.ex[i],s=e.sets[j];unlockAudio();s.done=!s.done;let advanced=-1;
 if(s.done){const prev=prevFor(e.key,d.id),ps=prev?(prev.sets[j]||prev.sets[prev.sets.length-1]):null,[lo]=range(e.reps);
  if(e.kind==='hold'||e.kind==='carry'){if(!String(s.secs).trim())s.secs=String(num(ps?.secs)??lo??'')}else if(!String(s.reps).trim())s.reps=String(num(ps?.reps)??lo??'');
  const nx=e.sets[j+1];if(nx&&!nx.done&&!String(nx.weight).trim()&&String(s.weight).trim())nx.weight=s.weight;
  s.pr=isPR(e,s,j);if(s.pr){toast(`New PR · ${e.name} ${fmtSet(e.kind,s)}`);beep(1320,.12)}
  const exDone=e.sets.every(x=>x.done),allDone=d.ex.every(x=>x.sets.every(y=>y.done));
  if(!allDone)startRest(restSec(e),e.name);else clearRest();
  if(exDone){e.open=false;advanced=d.ex.findIndex((x,k)=>k>i&&x.sets.some(y=>!y.done));if(advanced<0)advanced=d.ex.findIndex(x=>x.sets.some(y=>!y.done));if(advanced>=0)d.ex[advanced].open=true}
 }else s.pr=false;
 touch();
 if(advanced>=0){render();const n=$('#ex-'+advanced);if(n)setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60)}
 else{refreshEx(i);updateCounter()}}
function refreshEx(i){const el=$('#ex-'+i);if(el)el.outerHTML=exCard(S.draft.ex[i],i)}
function updateCounter(){const c=$('#sess-count');if(!c||!S.draft||!S.draft.ex)return;const d=S.draft;c.textContent=`${d.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}/${d.ex.reduce((a,e)=>a+e.sets.length,0)}`}
function exCard(e,i){
 const prev=prevFor(e.key,S.draft.id),best=bestFor(e.key,e.kind,S.draft.id),n=e.sets.filter(s=>s.done).length,complete=n===e.sets.length,[lo,hi]=range(e.reps);
 const timed=e.kind==='hold'||e.kind==='carry';
 const ready=prev&&prev.all&&prev.all.length>=e.sets.length&&prev.all.every(s=>s.done&&(timed?num(s.secs):num(s.reps))>=hi);
 const cols={load:['lb','reps'],bw:['+lb','reps'],carry:['lb/hand','sec'],hold:['sec','+lb']}[e.kind];
 const inp=(s,j,f,ph,lab)=>`<input type="text" inputmode="decimal" autocomplete="off" data-in="set" data-f="${f}" data-i="${i}" data-j="${j}" value="${esc(s[f])}" placeholder="${esc(ph)}" aria-label="${lab} set ${j+1}">`;
 const rows=e.sets.map((s,j)=>{const ps=prev?(prev.sets[j]||prev.sets[prev.sets.length-1]):null;
  const wPh=e.kind==='bw'?'+0':'lb',rPh=String(num(ps?.reps)??lo??''),tPh=String(num(ps?.secs)??lo??'');
  const a=e.kind==='hold'?inp(s,j,'secs',tPh,'Seconds'):inp(s,j,'weight',wPh,e.kind==='bw'?'Added weight':'Weight');
  const b=e.kind==='hold'?inp(s,j,'weight','+0','Added weight'):e.kind==='carry'?inp(s,j,'secs',tPh,'Seconds'):inp(s,j,'reps',rPh,'Reps');
  return `<div class="set ${s.done?'done':''}"><span class="set-n">${j+1}</span>${a}${b}<button class="set-check" data-a="checkSet" data-i="${i}" data-j="${j}" aria-label="Mark set ${j+1} ${s.done?'not done':'done'}" aria-pressed="${s.done}">${CHECK}</button>${s.pr?'<span class="pr">PR</span>':''}</div>`}).join('');
 const bw=latestBW();
 return `<section class="ex ${e.open?'open':''} ${complete?'complete':n?'partial':''}" id="ex-${i}">
 <button class="ex-head" data-a="toggleEx" data-i="${i}" aria-expanded="${!!e.open}"><span class="ex-dot">${complete?CHECK:n+'/'+e.sets.length}</span><span class="ex-title"><b>${esc(e.name)}</b><small>${e.sets.length} × ${esc(e.reps)} · rest ${restLabel(e)}</small></span><span class="chev"></span></button>
 <div class="ex-body">
  <div class="ex-meta">${prev?`<div><span>Last</span>${prev.sets.map(s=>esc(fmtSet(e.kind,s))).join(' · ')} <small class="muted">(${esc(fmtDate(prev.date,{month:'short',day:'numeric'}))})</small></div>`:'<div><span>Last</span>First time logging this one</div>'}${best.set?`<div><span>Best</span>${esc(fmtSet(e.kind,best.set))}${e.kind==='load'&&num(best.set.reps)?` · e1RM ${Math.round(best.score)}`:''}</div>`:''}${e.kind==='bw'?`<div><span>Bodyweight</span>${bw?bw+' lb':'Add a weigh-in under Progress'} — log added load only</div>`:''}</div>
  ${ready?'<div class="hint-good">↑ You hit the top of the range on every set last time. Add weight if your form was solid.</div>':''}
  <div class="sets-h"><span>#</span><span>${cols[0]}</span><span>${cols[1]}</span><span>Done</span></div>
  ${rows}
  <div class="ex-tools"><button class="btn sm ghost" data-a="addSet" data-i="${i}">+ Set</button><button class="btn sm ghost" data-a="rmSet" data-i="${i}" ${e.sets.length<=1?'disabled':''}>− Set</button><button class="btn sm ghost" data-a="rest" data-i="${i}">Rest ${restSec(e)>=120?mmss(restSec(e)):restSec(e)+'s'}</button></div>
  <details class="cue"><summary>Form cue</summary><p>${esc(e.cue)}</p></details>
  <textarea class="sm" data-in="exNotes" data-i="${i}" placeholder="Notes for ${esc(e.name)}">${esc(e.notes)}</textarea>
 </div></section>`}
function sessionHeader(title,sub){return `<div class="sess-h"><button class="back" data-a="back" aria-label="Back to workouts">${BACK}</button><div><h1>${esc(title)}</h1><div class="muted">${esc(sub)}</div></div></div>`}

function viewStrength(){const d=S.draft,p=STRENGTH[d.ref];
 const total=d.ex.reduce((a,e)=>a+e.sets.length,0),done=d.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);

async function buildStrengthLog(d){
 const total=d.ex.reduce((a,e)=>a+e.sets.length,0),done=d.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
 if(!done&&!await ask('No sets checked off','Save this session anyway? It will be marked partial.','Save anyway'))return null;
 // final PR flags: best completed set per exercise that beats all prior history
 const ex=d.ex.map(e=>{const b=bestFor(e.key,e.kind,d.id);let top=-1,topSc=b.set?b.score:Infinity,topW=b.set?b.maxW:Infinity;
  e.sets.forEach((s,j)=>{if(!s.done)return;const sc=setScore(e.kind,s);if(sc>topSc+1e-9||(e.kind==='load'&&(num(s.weight)||0)>topW)){top=j;topSc=Math.max(topSc,sc);topW=Math.max(topW,num(s.weight)||0)}});
  return{key:e.key,name:e.name,kind:e.kind,target:`${e.sets.length} × ${e.reps}`,notes:e.notes||'',sets:e.sets.map((s,j)=>({weight:s.weight,reps:s.reps,secs:s.secs,done:!!s.done,pr:j===top}))}});
 const mins=Math.round((Date.now()-d.startedAt)/60000);
 return{id:d.id,schema:SCHEMA,program:'v2',category:'strength',type:d.ref,name:STRENGTH[d.ref].name,date:d.date,status:done===total?'completed':'partial',notes:d.notes||'',warmup:!!d.warmup,bw:latestBW(),durationMin:mins>0&&mins<240?mins:null,exercises:ex,createdAt:d.startedAt,updatedAt:Date.now()}}

/* ---------- EMOM ---------- */
function emElapsed(t){if(!t.start)return 0;return((t.pausedAt||Date.now())-t.start-t.paused)/1000}
const emN=e=>e.rounds*e.st.length;
function roundsDone(d=S.draft){const e=EMOMS[d.ref],g=d.emom.grid;let n=0;for(let r=0;r<e.rounds;r++)if(g.every(row=>row[r]))n++;return n}
function curIdx(){const d=S.draft,e=EMOMS[d.ref],t=d.emom.timer;if(!t.start||t.done)return null;const idx=Math.min(Math.floor(emElapsed(t)/60),emN(e)-1);return{idx,st:idx%e.st.length,rd:Math.floor(idx/e.st.length)}}
function markIdx(k){const d=S.draft,e=EMOMS[d.ref];d.emom.grid[k%e.st.length][Math.floor(k/e.st.length)]=true}
function timerInner(){const d=S.draft,e=EMOMS[d.ref],t=d.emom.timer,N=emN(e),total=N*60;
 if(!t.start)return `<div class="em-top"><span class="pill">${e.rounds} rounds × ${e.st.length} stations</span></div><div class="em-clock">${N}:00</div><div class="em-now"><small>First up</small><b>${esc(e.st[0].name)}</b><span>${esc(e.st[0].target)}</span></div><button class="btn warm full big" data-a="emStart">Start EMOM</button><p class="muted small">Beeps at every new minute with a 3-2-1 countdown (turn off silent mode to hear them). The screen stays awake while it runs.</p>`;
 const el=Math.min(emElapsed(t),total);
 if(t.done||el>=total)return `<div class="em-clock done">Done</div><p>${roundsDone()}/${e.rounds} rounds complete. Untick anything you missed, then save below.</p><button class="btn ghost sm full" data-a="emReset">Reset timer</button>`;
 const c=curIdx(),rem=Math.ceil(60-(el-c.idx*60)),paused=!!t.pausedAt,nx=c.idx+1<N?e.st[(c.st+1)%e.st.length]:null,cur=d.emom.grid[c.st][c.rd];
 return `<div class="em-top"><span class="pill warm">Minute ${c.idx+1}/${N}</span><span class="pill">Round ${c.rd+1}/${e.rounds}</span><span class="pill" id="em-left">${mmss(total-el)} left</span></div>
 <div class="em-clock ${paused?'paused':''}" id="em-clock" aria-live="off">${Math.min(rem,60)}</div>
 <div class="em-bar"><i id="em-bar" style="width:${Math.max(0,(1-rem/60)*100)}%"></i></div>
 <div class="em-now"><small>${paused?'Paused':'Now'}</small><b>${esc(e.st[c.st].name)}</b><span>${esc(e.st[c.st].target)}</span></div>
 <div class="em-next">${nx?`Next: ${esc(nx.name)} · ${esc(nx.target)}`:'Last minute — finish strong'}</div>
 <div class="em-btns"><button class="btn ${cur?'primary':'ghost'}" data-a="emMark">${cur?CHECK+' Done':'Mark done'}</button><button class="btn ${paused?'warm':'ghost'}" data-a="${paused?'emStart':'emPause'}">${paused?'Resume':'Pause'}</button></div>
 <button class="btn ghost sm full" data-a="emReset">Reset timer</button>`}
function emGridCard(){const d=S.draft,e=EMOMS[d.ref],g=d.emom.grid,c=curIdx(),rd=roundsDone();
 return `<section class="card" id="em-grid"><div class="row-b"><h3>Rounds</h3><span class="pill ${rd===e.rounds?'ok':''}">${rd}/${e.rounds} complete</span></div>
 <p class="muted small">Each minute ticks off automatically when it ends. Tap a box to untick a minute you missed, or tick one you did without the timer.</p>

function viewEmom(){const d=S.draft,e=EMOMS[d.ref],sug=suggestedEmom(d.date),t=d.emom.timer,locked=!!t.start;
 const hist=S.logs.filter(l=>l.variant===d.ref).sort(sortDesc).slice(0,3);

function refreshTimer(){const t=$('#em-timer');if(t)t.innerHTML=timerInner();const g=$('#em-grid');if(g)g.outerHTML=emGridCard()}
const onEmomScreen=()=>S.tab==='work'&&S.view==='session'&&S.draft&&S.draft.kind==='emom';
function emTick(){const d=S.draft;if(!d||d.kind!=='emom')return;const t=d.emom.timer;if(!t.start||t.pausedAt||t.done)return;
 const e=EMOMS[d.ref],N=emN(e),total=N*60,el=emElapsed(t);
 if(el>=total){for(let k=t.lastIdx;k<N;k++)markIdx(k);t.lastIdx=N;t.done=true;t.pausedAt=t.start+t.paused+total*1000;touch();wake(false);beep(660,.4);setTimeout(()=>beep(990,.6),300);buzz([300,120,300]);if(onEmomScreen())refreshTimer();return}
 const idx=Math.floor(el/60);
 if(idx>t.lastIdx){const live=idx-t.lastIdx===1;for(let k=t.lastIdx;k<idx;k++)markIdx(k);t.lastIdx=idx;touch();if(live){beep(1046,.35);buzz(250)}if(onEmomScreen())refreshTimer()}
 const rem=Math.ceil(60-(el-idx*60));
 if(rem<=3&&rem>=1&&S.emBeep!==idx*10+rem){S.emBeep=idx*10+rem;beep(740,.09)}
 if(onEmomScreen()){const c=$('#em-clock');if(c)c.textContent=Math.min(rem,60);const b=$('#em-bar');if(b)b.style.width=Math.max(0,(1-rem/60)*100)+'%';const l=$('#em-left');if(l)l.textContent=mmss(total-el)+' left'}}

 try{await Store.putLog(log);okSaved();return true}catch(e){if(before)S.logs[i]=before;else S.logs=S.logs.filter(l=>l!==log);try{mirror()}catch(_){}fail(e,'Couldn\'t save this session — it\'s still open. Export a backup, then try again.');return false}}

 <section class="card"><h3>Strength progression</h3>${keys.length?`<select data-in="progEx" aria-label="Exercise">${keys.map(([k,n])=>`<option value="${esc(k)}" ${k===S.progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>${exProgress(sel)}`:'<div class="empty">Finish a strength workout to see your progression here.</div>'}</section>

 ${[...(S.meta.weight||[])].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(w=>`<div class="kv"><span>${esc(fmtDate(w.date))}</span><b>${esc(w.value)} lb <button class="btn sm ghost" style="min-height:30px;padding:0 8px;margin-left:6px" data-a="delBW" data-d="${esc(w.date)}" data-v="${esc(w.value)}" aria-label="Delete weigh-in">×</button></b></div>`).join('')||'<p class="muted small">No weigh-ins yet.</p>'}</section>`}

 const pts=h.slice(-16).map(x=>({d:x.date,y:Math.max(...x.sets.map(metric[1]))}));

function barChart(vals,labels,max){const W=330,H=150,T=22,B=22,bw=W/vals.length,ih=H-T-B;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly completion: ${vals.join(', ')}">${vals.map((v,i)=>{const h=Math.max(v/max*ih,v?4:0),x=i*bw+bw*.2,w=bw*.6,y=T+ih-h,last=i===vals.length-1;
  return `<rect x="${x}" y="${T}" width="${w}" height="${ih}" rx="6" style="fill:var(--s2)"/>${v?`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" style="fill:${last?'var(--ac)':'var(--ac2)'}"/>`:''}<text x="${x+w/2}" y="${y-6}" text-anchor="middle" class="cv">${v}</text><text x="${x+w/2}" y="${H-5}" text-anchor="middle" class="cl">${esc(labels[i])}</text>`}).join('')}</svg>`}
function lineChart(pts){if(pts.length<2)return'<p class="muted small">Log this exercise in at least two sessions to see a trend.</p>';
 const W=330,H=160,L=38,R=12,T=16,B=24;let lo=Math.min(...pts.map(p=>p.y)),hi=Math.max(...pts.map(p=>p.y));if(lo===hi){lo=Math.max(0,lo-5);hi+=5}const pd=(hi-lo)*.15;lo=Math.max(0,lo-pd);hi+=pd;
 const X=i=>L+i*(W-L-R)/(pts.length-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),r=v=>Math.round(v);
 const grid=[hi,(hi+lo)/2,lo].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="cl">${r(v)}</text>`).join('');
 const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');const lp=pts[pts.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend from ${pts[0].y} to ${lp.y}">${grid}<path d="${path}" fill="none" style="stroke:var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:3}" style="fill:${i===pts.length-1?'var(--ac)':'var(--bg)'};stroke:var(--ac)" stroke-width="2"/>`).join('')}<text x="${X(pts.length-1)}" y="${Y(lp.y)-10}" text-anchor="end" class="cv">${lp.y}</text><text x="${L}" y="${H-5}" class="cl">${esc(fmtDate(pts[0].d,{month:'short',day:'numeric'}))}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="cl">${esc(fmtDate(lp.d,{month:'short',day:'numeric'}))}</text></svg>`}

 const c=await sheet({title:'Import backup',body:`Found <b>${logs.length}</b> sessions and <b>${weight.length}</b> weigh-ins${d.exportedAt?` (exported ${esc(new Date(d.exportedAt).toLocaleDateString())})`:''}.<br><br><b>Merge</b> keeps everything here and adds anything new. <b>Replace</b> wipes this device's data first — a safety copy of the current data is exported before replacing.`,actions:[{label:'Merge',v:'merge',cls:'primary'},{label:'Replace all data',v:'replace',cls:'danger'},{label:'Cancel',v:null}]});

 else{const ids=new Set(S.logs.map(l=>l.id));logs.forEach(l=>{if(!ids.has(l.id)){S.logs.push(l);added++}});const wk=new Set((S.meta.weight||[]).map(w=>w.date+'|'+w.value));weight.forEach(w=>{if(!wk.has(w.date+'|'+w.value))S.meta.weight.push(w)})}
 try{await Store.replaceAll();okSaved();toast(c==='replace'?`Replaced with ${added} sessions`:`Imported ${added} new session${added===1?'':'s'}`)}catch(e){S.logs=snapshot.logs;S.meta=snapshot.meta;fail(e,'Import failed — your existing data was kept.')}

 if(S.draft&&S.draft.rest&&S.draft.rest.end>Date.now())S.rest=S.draft.rest;
 if(src!=='idb'){try{await Store.replaceAll();okSaved()}catch(e){fail(e,'Couldn\'t write to device storage.')}}
 if(src==='legacy'&&S.meta.migratedFromV1At)setTimeout(()=>toast(`Imported ${S.meta.legacyCount||S.logs.length} sessions from the previous version`),400);
 if(S.draft&&Date.now()-(S.draft.updatedAt||0)<3*3600e3){S.tab='work';S.view='session'}
 render();
 checkPersist(true).then(()=>{if(S.tab==='hist')render()});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot().catch(e=>{console.error(e);$('#app').innerHTML=`<section class="card banner err"><b>Something went wrong starting the app</b><p class="small muted">${esc(e&&e.message)}</p><p class="small muted">Your data has not been deleted. Try reloading.</p></section>`});
</script>
</body>
