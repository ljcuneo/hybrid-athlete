<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Hybrid Athlete • Training Log</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#ecf2f4;background:#0c1218}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{padding:24px 18px 14px;background:linear-gradient(135deg,#152e33,#111923)}.eyebrow{color:#86d9c4;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:750}h1{font-size:27px;margin:5px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}.sub,.muted{color:#9eb0bb;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#17222b;border:1px solid #2b3a44;border-radius:17px;padding:16px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;color:#8fe3cc;background:#1d413e;border-radius:100px;padding:5px 9px;white-space:nowrap}.btn{border:0;border-radius:11px;padding:11px 14px;background:#84ddc3;color:#10221f;font-weight:750;cursor:pointer}.btn.secondary{background:#2a3b46;color:#e8f2f4}.btn.danger{background:#49292f;color:#ffd8db}.btn.small{padding:8px 10px;font-size:12px}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#1a2932;border-radius:13px;padding:13px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:#a4b6c0}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#121e26;border-top:1px solid #2b3a44;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:10}nav button{background:none;border:0;color:#9cb0ba;font-size:11px;padding:7px 8px;min-width:64px}nav button.active{color:#8de3c9;font-weight:800}nav b{display:block;font-size:20px;margin-bottom:2px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap;border:1px solid #33454f;background:#1a2932;color:#d9e6ea;border-radius:12px;padding:10px 14px}.tabs button.active{background:#2d6358;border-color:#7fd9bd}.exercise{border-top:1px solid #2b3a44;padding:14px 0}.exercise:first-child{border-top:0}.exercise label{display:block;font-weight:650;font-size:14px;margin-bottom:5px}.inputs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inputs input{width:76px}.inputs select{width:90px}input,select,textarea{background:#0d171e;color:#edf4f6;border:1px solid #3b4e59;border-radius:9px;padding:10px;font:inherit;font-size:14px;max-width:100%}input[type=date]{width:160px}input[type=checkbox]{accent-color:#84ddc3;width:20px;height:20px}.set{display:flex;align-items:center;gap:8px;margin-top:7px}.set span{font-size:12px;color:#b0c1ca;width:42px}.set input{width:75px}.set .done{margin-left:auto}.hint{font-size:12px;color:#9cafb9;margin-top:6px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #33454f;border-radius:11px;padding:9px 2px;text-align:center;font-size:11px;min-height:75px}.day.today{border-color:#8de3c9}.day strong{display:block;font-size:12px}.day span{display:block;color:#9db0b9;font-size:10px;margin-top:6px;word-break:break-word}.day.complete{background:#1c423c}.history{padding:12px 0;border-bottom:1px solid #2b3a44}.history:last-child{border:0}.empty{color:#a6b7c0;text-align:center;padding:25px 10px}.full{width:100%}.footer-actions{display:flex;gap:8px;flex-wrap:wrap}.bar{height:8px;border-radius:10px;background:#2b3c45;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#86d9c4}svg{max-width:100%;height:auto}textarea{width:100%;min-height:75px}small{color:#a6b7c0}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#8de3c9;color:#10221f;padding:10px 16px;border-radius:11px;display:none;z-index:20}a{color:#8de3c9} .chip{padding:6px 9px;border-radius:10px;background:#273944;color:#c5d7de;font-size:12px}.spacer{height:7px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}nav{max-width:760px;margin:auto;border-left:1px solid #2b3a44;border-right:1px solid #2b3a44}}
</style></head><body><header><div style="max-width:760px;margin:auto"><div class="eyebrow">Personal training dashboard</div><h1>HYBRID ATHLETE</h1><div class="sub">Strength · Power · Surf · Soccer · Climb</div></div></header><main id="app" class="wrap"></main><nav id="nav"></nav><div id="toast"></div><script>
const PROGRAM={A:{name:'Strength A',focus:'Heavy upper + posterior chain',ex:[['Weighted dips',4,'5–8'],['Weighted pull-ups',4,'5–8'],['Leg press',3,'8–12'],['Romanian deadlift',3,'8–10'],['Face pulls',3,'15'],['Hanging leg raises',3,'10–15']]},B:{name:'Strength B',focus:'Hypertrophy + unilateral legs',ex:[['Incline dumbbell press',4,'8–12'],['Chest-supported row',4,'8–12'],['Bulgarian split squat',3,'8–10 / leg'],['Hip thrust',3,'10–12'],['Lateral raises',3,'12–15'],['Biceps curl',3,'10–12'],['Triceps pushdown',3,'10–12']]},C:{name:'Strength C',focus:'Shoulders + back + legs',ex:[['Overhead press',3,'6–10'],['Lat pulldown / chin-up',3,'8–12'],['Leg press',3,'12–15'],['Back extension',2,'12–15'],['Cable fly / pec deck',3,'12–15'],['Calf raises',3,'12–15']]},E:{name:'Power + Surf EMOM',focus:'24 minutes · 6 stations × 4 rounds',ex:[['KB clean + front squat',4,'3 + 3 / side'],['Explosive pull-up',4,'3–4'],['Burpee-to-pop-up',4,'5'],['KB halo',4,'5 / direction'],['Half-kneeling KB chop',4,'8 / side'],['Hanging knee-to-elbow twist',4,'6 / side']]}};
const SCHEDULE=[['Mon','A'],['Tue','Soccer / Surf'],['Wed','B'],['Thu','Recovery / Surf'],['Fri','C'],['Sat','E'],['Sun','Rest / Climb']];
const KEY='hybridAthleteLogV1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{logs:[],weight:[]}}catch(e){db={logs:[],weight:[]}};db.logs??=[];db.weight??=[];let tab='home',selected='A',editDate=localDate(),draft={},sport='Surfing';const $=s=>document.querySelector(s);function localDate(d=new Date()){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save. Browser storage may be disabled or full. Export your data now.')}}function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}function recentDays(n){let a=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(localDate(d))}return a}function monday(d=new Date()){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return localDate(x)}function weekLogs(){let start=monday();return db.logs.filter(x=>x.date>=start)}function totalSetCount(log){return (log.exercises||[]).reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function switchTab(t){tab=t;render()}function renderNav(){let a=[['home','⌂','Week'],['train','▣','Train'],['sports','⚽','Sports'],['history','▤','History'],['progress','↗','Progress']];$('#nav').innerHTML=a.map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')"><b>${ic}</b>${label}</button>`).join('')}
function renderHome(){let w=weekLogs(),strength=w.filter(x=>['A','B','C'].includes(x.type)).length,emom=w.filter(x=>x.type==='E').length,sports=w.filter(x=>x.type==='sport').length;let today=new Date().getDay();return `<h2>This week</h2><div class="grid"><div class="stat"><strong>${strength}/3</strong><span>Strength sessions</span></div><div class="stat"><strong>${emom}/1</strong><span>EMOM sessions</span></div><div class="stat"><strong>${sports}</strong><span>Sport sessions</span></div><div class="stat"><strong>${w.length}</strong><span>Total sessions</span></div></div><div class="spacer"></div><div class="card"><div class="row"><h3>Weekly training split</h3><span class="pill">Flexible schedule</span></div><div class="week">${SCHEDULE.map((x,i)=>{let date=new Date();date.setDate(date.getDate()-(date.getDay()+6)%7+i);let ds=localDate(date);let complete=db.logs.some(l=>l.date===ds);return `<div class="day ${complete?'complete':''} ${((today+6)%7)===i?'today':''}"><strong>${x[0]}</strong><span>${x[1]==='E'?'EMOM':safe(x[1])}</span>${complete?'✓':''}</div>`}).join('')}</div><p class="hint">Green = at least one session logged. Move workouts to accommodate sports and recovery.</p></div><div class="card"><h3>Quick start</h3><div class="footer-actions"><button class="btn" onclick="selected='${['A','B','C','E'][(new Date().getDay()+6)%7%4]}';switchTab('train')">Log a workout</button><button class="btn secondary" onclick="switchTab('sports')">Log sport</button></div></div><div class="card"><h3>Training reminders</h3><p class="muted">5 min bike/row + 2–3 ramp-up sets before heavy lifting. Rest 2–3 min on compounds, 60–90 sec on accessories. Keep 1–2 reps in reserve. On hard soccer/climbing weeks, reduce overlapping gym volume.</p></div>`}
function latestSets(name){for(let l of [...db.logs].reverse()){let e=(l.exercises||[]).find(x=>x.name===name);if(e)return e.sets}return null}function initDraft(){draft={};for(let [name,count] of PROGRAM[selected].ex){let prev=latestSets(name);draft[name]=Array.from({length:count},(_,i)=>({weight:prev?.[i]?.weight??'',reps:prev?.[i]?.reps??'',done:false}))}}
function renderTrain(){if(!Object.keys(draft).length)initDraft();let p=PROGRAM[selected];return `<h2>Log workout</h2><div class="tabs">${Object.keys(PROGRAM).map(k=>`<button class="${selected===k?'active':''}" onclick="chooseWorkout('${k}')">${k==='E'?'EMOM':`Day ${k}`}</button>`).join('')}</div><div class="card"><div class="row"><div><h3>${p.name}</h3><div class="muted">${p.focus}</div></div><span class="pill">${selected==='E'?'24 min':'Strength'}</span></div><p class="hint">${selected==='E'?'One row per station per round. Record kettlebell load and completed reps. Rest 15–25 sec per minute.':'Record load in lb (or change unit in notes), reps, and check completed sets.'}</p><label class="hint">Session date <input id="trainDate" type="date" value="${editDate}" onchange="editDate=this.value"></label></div><div class="card">${p.ex.map(([name,count,range])=>`<div class="exercise"><div class="row"><label>${safe(name)}</label><span class="chip">${count} × ${safe(range)}</span></div>${draft[name].map((s,i)=>`<div class="set"><span>${selected==='E'?'Rd':'Set'} ${i+1}</span><input type="number" inputmode="decimal" placeholder="lb" aria-label="Weight" value="${safe(s.weight)}" oninput="updateSet('${safe(name)}',${i},'weight',this.value)"><input type="text" placeholder="reps" aria-label="Reps" value="${safe(s.reps)}" oninput="updateSet('${safe(name)}',${i},'reps',this.value)"><label class="done"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet('${safe(name)}',${i},'done',this.checked)"></label></div>`).join('')}</div>`).join('')}<label class="hint" for="notes">Session notes / RPE / pain or recovery</label><textarea id="notes" placeholder="How did it feel?"></textarea><div class="spacer"></div><button class="btn full" onclick="finishWorkout()">Save workout to history</button></div>`}
function chooseWorkout(k){selected=k;draft={};render()}function updateSet(n,i,key,v){draft[n][i][key]=v}function finishWorkout(){let completed=Object.values(draft).flat().filter(s=>s.done).length;if(!completed&&!confirm('No sets checked. Save this session anyway?'))return;db.logs.push({id:Date.now(),date:$('#trainDate').value||localDate(),type:selected,name:PROGRAM[selected].name,notes:$('#notes').value,exercises:PROGRAM[selected].ex.map(([name])=>({name,sets:draft[name].map(s=>({...s}))}))});db.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);save();draft={};toast('Workout saved');tab='history';render()}
function renderSports(){return `<h2>Log sport or recovery</h2><div class="card"><label class="hint">Activity</label><select id="sport" class="full"><option>Surfing</option><option>Soccer</option><option>Climbing</option><option>Recovery / Mobility</option><option>Walking / Zone 2</option><option>Other</option></select><div class="spacer"></div><label class="hint">Date</label><input id="sportDate" class="full" type="date" value="${localDate()}"><div class="spacer"></div><label class="hint">Duration (minutes)</label><input id="duration" class="full" type="number" inputmode="numeric" min="0" placeholder="60"><div class="spacer"></div><label class="hint">Effort</label><select id="effort" class="full"><option value="Easy">Easy / recovery</option><option value="Moderate" selected>Moderate</option><option value="Hard">Hard / intense</option></select><div class="spacer"></div><label class="hint">Notes</label><textarea id="sportNotes" placeholder="Waves, match intensity, climbing grade, how you felt..."></textarea><button class="btn full" onclick="saveSport()">Save activity</button></div>`}function saveSport(){let duration=Number($('#duration').value);if(!Number.isFinite(duration)||duration<=0){alert('Enter a duration greater than zero');return}db.logs.push({id:Date.now(),date:$('#sportDate').value||localDate(),type:'sport',name:$('#sport').value,duration,effort:$('#effort').value,notes:$('#sportNotes').value});db.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);save();toast('Activity saved');tab='history';render()}
function renderHistory(){let logs=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return `<h2>Training history</h2><div class="card">${logs.length?logs.map(l=>`<div class="history"><div class="row"><div><strong>${safe(l.name)}</strong><div class="muted">${safe(l.date)} · ${l.type==='sport'?`${l.duration} min · ${safe(l.effort)}`:`${totalSetCount(l)} completed sets`}</div></div><button class="btn small secondary" onclick="toggleDetails(${l.id})">Details</button></div><div id="details${l.id}" hidden style="margin-top:10px">${l.type==='sport'?'':(l.exercises||[]).map(e=>`<p class="hint"><strong>${safe(e.name)}</strong>: ${e.sets.filter(s=>s.done).map(s=>`${safe(s.weight||'BW')} × ${safe(s.reps||'—')}`).join(', ')||'No sets marked'}</p>`).join('')}<p class="muted">${safe(l.notes||'No notes')}</p><button class="btn small danger" onclick="removeLog(${l.id})">Delete entry</button></div></div>`).join(''):'<div class="empty">Your saved sessions will appear here.</div>'}</div><div class="card"><h3>Backup your progress</h3><p class="muted">Data is stored in this browser on this device. Export regularly; clearing browser data or opening the file in a different browser may lose access to your history.</p><div class="footer-actions"><button class="btn secondary" onclick="exportData()">Export JSON</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button><label class="btn secondary" style="cursor:pointer">Import JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div></div>`}function toggleDetails(id){let e=$('#details'+id);e.hidden=!e.hidden}function removeLog(id){if(confirm('Delete this session?')){db.logs=db.logs.filter(x=>x.id!==id);save();render()}}function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('hybrid-athlete-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let rows=[['date','activity','type','exercise','set','weight','reps','completed','duration_minutes','effort','notes']];for(let l of db.logs){if(l.type==='sport')rows.push([l.date,l.name,l.type,'','','','', '',l.duration,l.effort,l.notes]);else for(let e of l.exercises||[])e.sets.forEach((s,i)=>rows.push([l.date,l.name,l.type,e.name,i+1,s.weight,s.reps,s.done,'','',l.notes]))}download('hybrid-athlete-log.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.logs)||!Array.isArray(d.weight))throw Error();if(!confirm('Replace all current data with imported backup?'))return;db=d;save();render();toast('Backup imported')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function renderProgress(){let dates=recentDays(28),counts=dates.map(d=>db.logs.filter(l=>l.date===d).length),max=Math.max(1,...counts),width=560,height=130;let bars=counts.map((v,i)=>`<rect x="${i*20+3}" y="${height-v/max*110}" width="13" height="${v/max*110}" rx="3" fill="${v?'#83dbc1':'#293b45'}"/>`).join('');let total=db.logs.length,sets=db.logs.reduce((a,l)=>a+totalSetCount(l),0),sportMins=db.logs.filter(l=>l.type==='sport').reduce((a,l)=>a+(Number(l.duration)||0),0);let exercises=[...new Set(db.logs.flatMap(l=>(l.exercises||[]).map(e=>e.name)))].sort();return `<h2>Progress</h2><div class="grid"><div class="stat"><strong>${total}</strong><span>All sessions</span></div><div class="stat"><strong>${sets}</strong><span>Completed sets</span></div><div class="stat"><strong>${sportMins}</strong><span>Sport minutes</span></div><div class="stat"><strong>${db.weight.length?db.weight[db.weight.length-1].value:'—'}</strong><span>Latest bodyweight (lb)</span></div></div><div class="spacer"></div><div class="card"><h3>Sessions · last 28 days</h3><svg viewBox="0 0 560 150" role="img" aria-label="Daily training sessions over the last 28 days">${bars}<text x="4" y="146" fill="#a5b7c1" font-size="12">28 days ago</text><text x="485" y="146" fill="#a5b7c1" font-size="12">Today</text></svg></div><div class="card"><h3>Exercise progression</h3>${exercises.length?`<select id="exerciseChoice" class="full" onchange="showExerciseProgress()">${exercises.map(e=>`<option>${safe(e)}</option>`).join('')}</select><div id="exerciseProgress"></div>`:'<div class="empty">Log a strength session to see your weight and rep history.</div>'}</div><div class="card"><h3>Bodyweight log</h3><div class="inputs"><input id="bodyDate" type="date" value="${localDate()}"><input id="bodyWeight" type="number" step="0.1" inputmode="decimal" placeholder="lb"><button class="btn small" onclick="saveWeight()">Add</button></div><div class="spacer"></div>${[...db.weight].reverse().slice(0,8).map(w=>`<div class="row history"><span>${safe(w.date)}</span><strong>${safe(w.value)} lb</strong></div>`).join('')||'<p class="muted">No weigh-ins yet.</p>'}</div>`}function showExerciseProgress(){let name=$('#exerciseChoice')?.value;if(!name)return;let a=db.logs.flatMap(l=>(l.exercises||[]).filter(e=>e.name===name).map(e=>({date:l.date,sets:e.sets.filter(s=>s.done)}))).filter(x=>x.sets.length);$('#exerciseProgress').innerHTML=a.length?a.slice(-12).reverse().map(x=>`<div class="row history"><span class="muted">${safe(x.date)}</span><span>${x.sets.map(s=>`${safe(s.weight||'BW')} × ${safe(s.reps||'—')}`).join(' · ')}</span></div>`).join(''):'<div class="empty">No completed sets logged for this exercise.</div>'}function saveWeight(){let value=Number($('#bodyWeight').value);if(!Number.isFinite(value)||value<=0){alert('Enter a valid bodyweight');return}db.weight.push({date:$('#bodyDate').value||localDate(),value});db.weight.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Weight saved')}
function render(){renderNav();$('#app').innerHTML=tab==='home'?renderHome():tab==='train'?renderTrain():tab==='sports'?renderSports():tab==='history'?renderHistory():renderProgress();if(tab==='progress')showExerciseProgress()}render();
</script></body></html>
