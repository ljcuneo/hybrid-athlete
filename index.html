<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Hybrid Athlete • Training Log</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#edf5f2;background:#0b1116;font-synthesis:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding-bottom:calc(90px + env(safe-area-inset-bottom));line-height:1.5}header{padding:30px 20px 24px;background:radial-gradient(ellipse at 90% 0%,#234d49 0%,transparent 52%),linear-gradient(145deg,#13232a,#0d151b);border-bottom:1px solid #26373c}.eyebrow{color:#9ce4cd;text-transform:uppercase;letter-spacing:.16em;font-size:10px;font-weight:800}h1{font-size:clamp(27px,6vw,35px);letter-spacing:-.055em;line-height:1.1;margin:10px 0 9px;font-weight:800}h2{font-size:22px;letter-spacing:-.035em;margin:5px 0 18px;font-weight:760}h3{font-size:15px;letter-spacing:-.015em;margin:0 0 10px;font-weight:750}.sub,.muted{color:#a5b8bf;font-size:13px}.wrap{max-width:760px;margin:auto;padding:22px 16px}.card{background:linear-gradient(145deg,#19262d,#152129);border:1px solid #2b3e45;border-radius:20px;padding:19px;margin-bottom:15px;box-shadow:0 7px 24px #00000013}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{font-size:11px;color:#b4f3df;background:#24443f;border:1px solid #37685d;border-radius:100px;padding:5px 10px;white-space:nowrap;font-weight:700}.btn{border:0;border-radius:12px;padding:12px 16px;min-height:44px;background:#9ae5cd;color:#102820;font-weight:750;font-size:13px;cursor:pointer;transition:filter .15s,transform .15s}.btn:active{transform:scale(.98)}.btn.secondary{background:#293c45;color:#e6f3f1}.btn.danger{background:#512c36;color:#ffe1e4}.btn.small{padding:8px 12px;min-height:36px;font-size:12px}button:disabled{opacity:.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#1c3036;border:1px solid #2a4447;border-radius:16px;padding:15px}.stat strong{font-size:25px;letter-spacing:-.05em;line-height:1.25;display:block;color:#eafff6}.stat span{font-size:11px;color:#afc3c8;display:block;margin-top:4px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111d24f5;backdrop-filter:blur(18px);border-top:1px solid #314249;padding:8px 4px max(12px,env(safe-area-inset-bottom));z-index:10}nav button{background:none;border:0;color:#a2b6bd;font-size:10px;padding:7px 5px;min-width:55px;cursor:pointer}nav button.active{color:#a0f0d6;font-weight:800}nav b{display:block;font-size:21px;margin-bottom:3px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 -2px 16px;padding:2px 2px 6px;scrollbar-width:thin}.tabs button{white-space:nowrap;border:1px solid #344a50;background:#1b2c34;color:#d7e7e9;border-radius:12px;padding:11px 14px;min-height:44px;font-weight:650;cursor:pointer}.tabs button.active{background:#2b6055;border-color:#89dfc4;color:white}.exercise{border-top:1px solid #304249;padding:17px 0}.exercise:first-child{border-top:0;padding-top:0}.exercise label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}.inputs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.inputs input{width:82px}.inputs select{width:100px}input,select,textarea{background:#0e1b22;color:#f1f8f7;border:1px solid #435b62;border-radius:11px;padding:11px;font:inherit;font-size:14px;max-width:100%;outline-offset:2px}input:focus,select:focus,textarea:focus{outline:2px solid #82d9bc;border-color:#82d9bc}input[type=date]{width:170px}input[type=checkbox]{accent-color:#9ae5cd;width:21px;height:21px;cursor:pointer}.set{display:flex;align-items:center;gap:8px;margin-top:9px}.set span{font-size:12px;color:#b7c8cd;width:46px;flex-shrink:0}.set input{width:75px;min-width:0}.set .done{margin-left:auto}.hint{font-size:12px;color:#afc1c7;margin-top:8px;line-height:1.6}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{border:1px solid #354b52;border-radius:12px;padding:10px 2px;text-align:center;font-size:11px;min-height:83px}.day.today{border-color:#98e6cb;box-shadow:inset 0 0 0 1px #98e6cb}.day strong{display:block;font-size:11px}.day span{display:block;color:#aec0c5;font-size:9px;margin-top:8px;overflow-wrap:anywhere;line-height:1.35}.day.complete{background:#21443e}.history{padding:14px 0;border-bottom:1px solid #304249}.history:last-child{border:0}.history .row>div{min-width:0}.empty{color:#afc0c6;text-align:center;padding:28px 10px}.full{width:100%}.footer-actions{display:flex;gap:9px;flex-wrap:wrap}.bar{height:8px;border-radius:10px;background:#2b3c45;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#86d9c4}svg{max-width:100%;height:auto}textarea{width:100%;min-height:85px;resize:vertical}small{color:#afc0c6}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#a5ecd6;color:#102820;padding:12px 17px;border-radius:12px;display:none;z-index:20;box-shadow:0 12px 30px #0006}a{color:#a0e8d2}.chip{padding:6px 9px;border-radius:10px;background:#273e46;color:#c9e3e2;font-size:12px;white-space:nowrap}.spacer{height:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}nav{max-width:760px;margin:auto;border-left:1px solid #2b3a44;border-right:1px solid #2b3a44}}@media(max-width:360px){.set{gap:5px}.set input{width:64px}.week{gap:3px}.day{padding-left:1px;padding-right:1px}}
</style></head><body><header><div style="max-width:760px;margin:auto"><div class="eyebrow">YOUR TRAINING SPACE</div><h1>Hybrid Athlete</h1><div class="sub">Lift strong. Move well. Stay ready.</div></div></header><main id="app" class="wrap"></main><nav id="nav"></nav><div id="toast"></div><script>
const PROGRAM={A:{name:'Strength A',focus:'Heavy upper + posterior chain',ex:[['Weighted dips',4,'5–8'],['Weighted pull-ups',4,'5–8'],['Leg press',3,'8–12'],['Romanian deadlift',3,'8–10'],['Face pulls',3,'15'],['Hanging leg raises',3,'10–15']]},B:{name:'Strength B',focus:'Hypertrophy + unilateral legs',ex:[['Incline dumbbell press',4,'8–12'],['Chest-supported row',4,'8–12'],['Bulgarian split squat',3,'8–10 / leg'],['Hip thrust',3,'10–12'],['Lateral raises',3,'12–15'],['Biceps curl',3,'10–12'],['Triceps pushdown',3,'10–12']]},C:{name:'Strength C',focus:'Shoulders + back + legs',ex:[['Overhead press',3,'6–10'],['Lat pulldown / chin-up',3,'8–12'],['Leg press',3,'12–15'],['Back extension',2,'12–15'],['Cable fly / pec deck',3,'12–15'],['Calf raises',3,'12–15']]},E1:{name:'EMOM 1 — Upper Strength',focus:'32 min · 4 stations × 8 rounds · Pull-ups +30–35 lb, dips +45–55 lb',ex:[['Weighted pull-up',8,'3 (+30–35 lb)'],['Weighted dip',8,'4 (+45–55 lb)'],['Heavy KB swing',8,'12 (28–32 kg)'],['Hollow body hold',8,'30 sec']]},E2:{name:'EMOM 2 — Legs + Hinge + Core',focus:'30 min · 5 stations × 6 rounds',ex:[['Double moderate KB front squat',6,'6 (20–24 kg each)'],['Heavy KB swing',6,'15 (28–32 kg)'],['Moderate KB single-leg RDL',6,'5 / side'],['Dip bar L-sit',6,'20 sec'],['Moderate KB lateral lunge',6,'5 / side']]},E3:{name:'EMOM 3 — Upper Volume + Grip',focus:'32 min · 4 stations × 8 rounds · Odd rounds: towel grip pull-ups × 4–5',ex:[['BW pull-up (odd rounds towel grip)',8,'6–8; odd 4–5'],['BW dip',8,'10–12'],['Seated moderate KB press',8,'5 / side'],['KB bottoms-up hold',8,'20 sec / side']]},E4:{name:'EMOM 4 — Power + Surf',focus:'24 min · 6 stations × 4 rounds',ex:[['KB clean → front squat',4,'3 clean + 3 squat; alternate sides'],['Explosive chest-to-bar pull-up',4,'4'],['Burpee-to-pop-up',4,'5'],['Moderate KB halo',4,'5 / direction'],['Half-kneeling KB chop',4,'8 / side'],['Hanging knee-to-elbow twist',4,'6 / side']]}};
const SCHEDULE=[['Mon','A'],['Tue','Soccer / Surf'],['Wed','B'],['Thu','Recovery / Surf'],['Fri','C'],['Sat','EMOM choice'],['Sun','Rest / Climb']];
const KEY='hybridAthleteLogV1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{logs:[],weight:[]}}catch(e){db={logs:[],weight:[]}};db.logs??=[];db.weight??=[];let tab='home',selected='A',editDate=localDate(),draft={},sport='Surfing',notesDraft='',touched=false,draftWarned=false;const $=s=>document.querySelector(s);
/* In-progress workout autosave. Stored under its own key so saved history (hybridAthleteLogV1) is never touched by draft writes. */
const DRAFT_KEY='hybridAthleteDraftV1';
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({v:1,selected,editDate,draft,notes:notesDraft,touched,savedAt:Date.now()}))}catch(e){if(!draftWarned){draftWarned=true;alert('Could not autosave this workout. Browser storage may be disabled or full. Keep the app open until you tap Save workout.')}}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function draftMatches(k=selected,d=draft){return !!PROGRAM[k]&&!!d&&PROGRAM[k].ex.every(([n,c])=>Array.isArray(d[n])&&d[n].length===c)}
function restoreDraft(){try{let d=JSON.parse(localStorage.getItem(DRAFT_KEY));if(!d||!draftMatches(d.selected,d.draft))return;selected=d.selected;editDate=d.editDate||editDate;draft=d.draft;notesDraft=d.notes||'';touched=!!d.touched;if(touched)tab='train'}catch(e){}}
function resetDraft(k){selected=k;draft={};notesDraft='';touched=false;initDraft();saveDraft()}
function startSuggested(k){if(touched){toast('Resuming your unfinished '+PROGRAM[selected].name)}else if(k!==selected||!draftMatches()){resetDraft(k)}switchTab('train')}function localDate(d=new Date()){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save. Browser storage may be disabled or full. Export your data now.');return false}}function toast(msg){let t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}function recentDays(n){let a=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);a.push(localDate(d))}return a}function monday(d=new Date()){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return localDate(x)}function weekLogs(){let start=monday();return db.logs.filter(x=>x.date>=start)}function totalSetCount(log){return (log.exercises||[]).reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function switchTab(t){tab=t;render()}function renderNav(){let a=[['home','⌂','Week'],['train','▣','Train'],['sports','⚽','Sports'],['history','▤','History'],['progress','↗','Progress']];$('#nav').innerHTML=a.map(([id,ic,label])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')"><b>${ic}</b>${label}</button>`).join('')}
function renderHome(){let w=weekLogs(),strength=w.filter(x=>['A','B','C'].includes(x.type)).length,emom=w.filter(x=>/^E[1-4]$/.test(x.type)||x.type==='E').length,sports=w.filter(x=>x.type==='sport').length;let today=new Date().getDay();return `${touched?`<div class="card"><div class="row"><div><h3>Unfinished workout</h3><div class="muted">${safe(PROGRAM[selected].name)} · ${safe(editDate)}</div></div><button class="btn" onclick="switchTab('train')">Resume</button></div></div>`:''}<h2>Your week</h2><div class="grid"><div class="stat"><strong>${strength}/3</strong><span>Strength workouts</span></div><div class="stat"><strong>${emom}/1</strong><span>EMOM workouts</span></div><div class="stat"><strong>${sports}</strong><span>Sport activities</span></div><div class="stat"><strong>${w.length}</strong><span>Total sessions</span></div></div><div class="spacer"></div><div class="card"><div class="row"><h3>Weekly plan</h3><span class="pill">Flexible schedule</span></div><div class="week">${SCHEDULE.map((x,i)=>{let date=new Date();date.setDate(date.getDate()-(date.getDay()+6)%7+i);let ds=localDate(date);let complete=db.logs.some(l=>l.date===ds);return `<div class="day ${complete?'complete':''} ${((today+6)%7)===i?'today':''}"><strong>${x[0]}</strong><span>${x[1]==='EMOM choice'?'EMOM choice':safe(x[1])}</span>${complete?'✓':''}</div>`}).join('')}</div><p class="hint">Highlighted days have logged activity. Adjust your plan around sports and recovery. Pick any of the four EMOMs each week from the Train tab.</p></div><div class="card"><h3>Ready to train?</h3><div class="footer-actions"><button class="btn" onclick="startSuggested('${['A','B','C','E4'][(new Date().getDay()+6)%7%4]}')">Start workout</button><button class="btn secondary" onclick="switchTab('sports')">Add activity</button></div></div><div class="card"><h3>Before you start</h3><p class="muted">5 min bike/row + 2–3 ramp-up sets before heavy lifting. Rest 2–3 min on compounds, 60–90 sec on accessories. Keep 1–2 reps in reserve. On hard soccer/climbing weeks, reduce overlapping gym volume.</p></div>`}
function latestSets(name){for(let l of [...db.logs].reverse()){let e=(l.exercises||[]).find(x=>x.name===name);if(e)return e.sets}return null}function initDraft(){draft={};for(let [name,count] of PROGRAM[selected].ex){let prev=latestSets(name);draft[name]=Array.from({length:count},(_,i)=>({weight:prev?.[i]?.weight??'',reps:prev?.[i]?.reps??'',done:false}))}}
function renderTrain(){if(!draftMatches()){initDraft();saveDraft()}let p=PROGRAM[selected];return `<h2>Choose your workout</h2><div class="tabs">${Object.keys(PROGRAM).map(k=>`<button class="${selected===k?'active':''}" onclick="chooseWorkout('${k}')">${k.startsWith('E')?`EMOM ${k.slice(1)}`:`Day ${k}`}</button>`).join('')}</div><div class="card"><div class="row"><div><h3>${p.name}</h3><div class="muted">${p.focus}</div></div><span class="pill">${selected.startsWith('E')?'EMOM':'Strength'}</span></div><p class="hint">${selected.startsWith('E')?'Each exercise is one station; each row is one round. Enter load and reps/time, check completed rounds. Work at the start of each minute and aim for 15–25 sec rest.':'Record load in lb (or change unit in notes), reps, and check completed sets.'}</p><label class="hint">Session date <input id="trainDate" type="date" value="${editDate}" onchange="editDate=this.value;saveDraft()"></label></div><div class="card">${p.ex.map(([name,count,range])=>`<div class="exercise"><div class="row"><label>${safe(name)}</label><span class="chip">${count} × ${safe(range)}</span></div>${draft[name].map((s,i)=>`<div class="set"><span>${selected.startsWith('E')?'Rd':'Set'} ${i+1}</span><input type="number" inputmode="decimal" placeholder="lb" aria-label="Weight" value="${safe(s.weight)}" oninput="updateSet('${safe(name)}',${i},'weight',this.value)"><input type="text" placeholder="reps" aria-label="Reps" value="${safe(s.reps)}" oninput="updateSet('${safe(name)}',${i},'reps',this.value)"><label class="done"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet('${safe(name)}',${i},'done',this.checked)"></label></div>`).join('')}</div>`).join('')}${selected.startsWith('E')?`<div class="card" style="margin:12px 0;background:#20313b"><strong>EMOM instructions</strong><p class="hint">Before: dead hang 2 × 30–45 sec; 3 slow toes-to-bar before each block. Moderate KB = 20–24 kg, heavy KB = 28–32 kg. Seated overhead KB work only. Skip a missed station and rejoin the next minute; stop a set if form breaks.</p><p class="hint"><strong>Finisher:</strong> ${selected==='E1'?'Farmer carry, 2 heavy KBs, 3 × 40 m':selected==='E2'?'Suitcase carry, heavy KB, 2 × 30 m per side':selected==='E3'?'Chin-up max set, 1 × AMRAP':'None prescribed'}</p></div>`:''}<label class="hint" for="notes">Session notes / RPE / pain or recovery</label><textarea id="notes" placeholder="How did it feel?" oninput="notesDraft=this.value;touched=true;saveDraft()">${safe(notesDraft)}</textarea><div class="spacer"></div><button class="btn full" onclick="finishWorkout()">Save workout</button></div>`}
function chooseWorkout(k){if(k===selected)return;if(touched&&!confirm(`Discard your unfinished ${PROGRAM[selected].name} and switch to ${PROGRAM[k].name}?`))return;resetDraft(k);render()}function updateSet(n,i,key,v){draft[n][i][key]=v;touched=true;saveDraft()}function finishWorkout(){let completed=Object.values(draft).flat().filter(s=>s.done).length;if(!completed&&!confirm('No sets checked. Save this session anyway?'))return;let entry={id:Date.now(),date:$('#trainDate').value||localDate(),type:selected,name:PROGRAM[selected].name,notes:$('#notes').value,exercises:PROGRAM[selected].ex.map(([name])=>({name,sets:draft[name].map(s=>({...s}))}))};db.logs.push(entry);db.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);if(!save()){db.logs=db.logs.filter(x=>x!==entry);return}draft={};notesDraft='';touched=false;clearDraft();toast('Workout saved');tab='history';render()}
function renderSports(){return `<h2>Add activity or recovery</h2><div class="card"><label class="hint">Activity</label><select id="sport" class="full"><option>Surfing</option><option>Soccer</option><option>Climbing</option><option>Recovery / Mobility</option><option>Walking / Zone 2</option><option>Other</option></select><div class="spacer"></div><label class="hint">Date</label><input id="sportDate" class="full" type="date" value="${localDate()}"><div class="spacer"></div><label class="hint">Duration (minutes)</label><input id="duration" class="full" type="number" inputmode="numeric" min="0" placeholder="60"><div class="spacer"></div><label class="hint">Effort</label><select id="effort" class="full"><option value="Easy">Easy / recovery</option><option value="Moderate" selected>Moderate</option><option value="Hard">Hard / intense</option></select><div class="spacer"></div><label class="hint">Notes</label><textarea id="sportNotes" placeholder="Waves, match intensity, climbing grade, how you felt..."></textarea><button class="btn full" onclick="saveSport()">Save activity</button></div>`}function saveSport(){let duration=Number($('#duration').value);if(!Number.isFinite(duration)||duration<=0){alert('Enter a duration greater than zero');return}db.logs.push({id:Date.now(),date:$('#sportDate').value||localDate(),type:'sport',name:$('#sport').value,duration,effort:$('#effort').value,notes:$('#sportNotes').value});db.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);save();toast('Activity saved');tab='history';render()}
function renderHistory(){let logs=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return `<h2>Workout history</h2><div class="card">${logs.length?logs.map(l=>`<div class="history"><div class="row"><div><strong>${safe(l.name)}</strong><div class="muted">${safe(l.date)} · ${l.type==='sport'?`${l.duration} min · ${safe(l.effort)}`:`${totalSetCount(l)} completed sets`}</div></div><button class="btn small secondary" onclick="toggleDetails(${l.id})">Details</button></div><div id="details${l.id}" hidden style="margin-top:10px">${l.type==='sport'?'':(l.exercises||[]).map(e=>`<p class="hint"><strong>${safe(e.name)}</strong>: ${e.sets.filter(s=>s.done).map(s=>`${safe(s.weight||'BW')} × ${safe(s.reps||'—')}`).join(', ')||'No sets marked'}</p>`).join('')}<p class="muted">${safe(l.notes||'No notes')}</p><button class="btn small danger" onclick="removeLog(${l.id})">Delete entry</button></div></div>`).join(''):'<div class="empty">Your saved sessions will appear here.</div>'}</div><div class="card"><h3>Back up your data</h3><p class="muted">Data is stored in this browser on this device. Export regularly; clearing browser data or opening the file in a different browser may lose access to your history.</p><div class="footer-actions"><button class="btn secondary" onclick="exportData()">Export JSON</button><button class="btn secondary" onclick="exportCSV()">Export CSV</button><label class="btn secondary" style="cursor:pointer">Import JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div></div>`}function toggleDetails(id){let e=$('#details'+id);e.hidden=!e.hidden}function removeLog(id){if(confirm('Delete this session?')){db.logs=db.logs.filter(x=>x.id!==id);save();render()}}function download(name,body,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('hybrid-athlete-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCSV(){let rows=[['date','activity','type','exercise','set','weight','reps','completed','duration_minutes','effort','notes']];for(let l of db.logs){if(l.type==='sport')rows.push([l.date,l.name,l.type,'','','','', '',l.duration,l.effort,l.notes]);else for(let e of l.exercises||[])e.sets.forEach((s,i)=>rows.push([l.date,l.name,l.type,e.name,i+1,s.weight,s.reps,s.done,'','',l.notes]))}download('hybrid-athlete-log.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.logs)||!Array.isArray(d.weight))throw Error();if(!confirm('Replace all current data with imported backup?'))return;db=d;save();render();toast('Backup imported')}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function renderProgress(){let dates=recentDays(28),counts=dates.map(d=>db.logs.filter(l=>l.date===d).length),max=Math.max(1,...counts),width=560,height=130;let bars=counts.map((v,i)=>`<rect x="${i*20+3}" y="${height-v/max*110}" width="13" height="${v/max*110}" rx="3" fill="${v?'#83dbc1':'#293b45'}"/>`).join('');let total=db.logs.length,sets=db.logs.reduce((a,l)=>a+totalSetCount(l),0),sportMins=db.logs.filter(l=>l.type==='sport').reduce((a,l)=>a+(Number(l.duration)||0),0);let exercises=[...new Set(db.logs.flatMap(l=>(l.exercises||[]).map(e=>e.name)))].sort();return `<h2>Progress</h2><div class="grid"><div class="stat"><strong>${total}</strong><span>All sessions</span></div><div class="stat"><strong>${sets}</strong><span>Completed sets</span></div><div class="stat"><strong>${sportMins}</strong><span>Sport minutes</span></div><div class="stat"><strong>${db.weight.length?db.weight[db.weight.length-1].value:'—'}</strong><span>Latest bodyweight (lb)</span></div></div><div class="spacer"></div><div class="card"><h3>Activity · last 28 days</h3><svg viewBox="0 0 560 150" role="img" aria-label="Daily training sessions over the last 28 days">${bars}<text x="4" y="146" fill="#a5b7c1" font-size="12">28 days ago</text><text x="485" y="146" fill="#a5b7c1" font-size="12">Today</text></svg></div><div class="card"><h3>Strength progress</h3>${exercises.length?`<select id="exerciseChoice" class="full" onchange="showExerciseProgress()">${exercises.map(e=>`<option>${safe(e)}</option>`).join('')}</select><div id="exerciseProgress"></div>`:'<div class="empty">Log a strength session to see your weight and rep history.</div>'}</div><div class="card"><h3>Bodyweight</h3><div class="inputs"><input id="bodyDate" type="date" value="${localDate()}"><input id="bodyWeight" type="number" step="0.1" inputmode="decimal" placeholder="lb"><button class="btn small" onclick="saveWeight()">Add</button></div><div class="spacer"></div>${[...db.weight].reverse().slice(0,8).map(w=>`<div class="row history"><span>${safe(w.date)}</span><strong>${safe(w.value)} lb</strong></div>`).join('')||'<p class="muted">No weigh-ins yet.</p>'}</div>`}function showExerciseProgress(){let name=$('#exerciseChoice')?.value;if(!name)return;let a=db.logs.flatMap(l=>(l.exercises||[]).filter(e=>e.name===name).map(e=>({date:l.date,sets:e.sets.filter(s=>s.done)}))).filter(x=>x.sets.length);$('#exerciseProgress').innerHTML=a.length?a.slice(-12).reverse().map(x=>`<div class="row history"><span class="muted">${safe(x.date)}</span><span>${x.sets.map(s=>`${safe(s.weight||'BW')} × ${safe(s.reps||'—')}`).join(' · ')}</span></div>`).join(''):'<div class="empty">No completed sets logged for this exercise.</div>'}function saveWeight(){let value=Number($('#bodyWeight').value);if(!Number.isFinite(value)||value<=0){alert('Enter a valid bodyweight');return}db.weight.push({date:$('#bodyDate').value||localDate(),value});db.weight.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Weight saved')}
function render(){renderNav();$('#app').innerHTML=tab==='home'?renderHome():tab==='train'?renderTrain():tab==='sports'?renderSports():tab==='history'?renderHistory():renderProgress();if(tab==='progress')showExerciseProgress()}restoreDraft();render();
</script></body></html>
